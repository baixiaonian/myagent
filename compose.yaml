# 本地单用户启动配置：宿主仅映射 loopback，命名卷保存设置、凭证与聊天历史。
# init 转发退出信号，宽限期用于取消生成并提交终态；不提供公网部署配置。
services:
  myagent:
    build: .
    init: true
    # 只向宿主 loopback 发布入口；容器内监听 0.0.0.0 不代表允许公网访问。
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - myagent-data:/data
      - myagent-workspaces:/workspaces
      - myagent-skills:/skills
      - myagent-hooks:/hooks
    environment:
      MYAGENT_WORKSPACE_ROOT: /workspaces
      MYAGENT_SKILL_ROOT: /skills
      MYAGENT_HOOK_ROOT: /hooks
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  myagent-data:
  myagent-workspaces:
  myagent-skills:
  myagent-hooks:
