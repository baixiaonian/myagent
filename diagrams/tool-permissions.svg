<text x="72" y="647" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#1F3042">这条命令能启动吗？</text>
<text x="72" y="688" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#647488">解析完整 Shell，逐段检查</text>
<text x="72" y="722" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#647488">低风险自动；其他默认询问</text>
<path d="M72 759H414" fill="none" stroke="#E7EDF2"/>
<text x="72" y="775" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" fill="#1F3042">用户级 + 项目级规则</text>
<text x="72" y="809" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#3566A8">[&quot;git&quot;, &quot;status&quot;] → allow</text>
<text x="72" y="840" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#647488">参数数组前缀匹配 · 自定义示例</text>
<rect x="72" y="870" width="342" height="32" rx="8" fill="#EAF0F8" stroke="#EAF0F8" stroke-width="1"/>
<text x="150.5" y="875" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#3566A8">拒绝  &gt;  询问  &gt;  允许</text>
<text x="560" y="350" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#1F3042">合并两项检查结果</text>
<text x="560" y="393" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#26755B">全部获准 → 可继续</text>
<text x="560" y="431" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#AC4A49">任何拒绝 → 不执行</text>
<text x="560" y="587" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" fill="#9B691D">用户审批</text>
<text x="560" y="631" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#1F3042">展示命令、目录、资源和原因</text>
<path d="M560 668H842" fill="none" stroke="#ECE3D2"/>
<text x="560" y="686" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" fill="#1F3042">命令：仅批准本次调用</text>
<text x="560" y="728" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">纯资源可选授权范围</text>
<text x="560" y="762" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1F3042">本次 · 会话 · 工作区</text>
<text x="598.0" y="874" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#AC4A49">拒绝 / 过期 → 不执行</text>
<text x="986" y="350" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" fill="#1F3042">执行前再复核</text>
<text x="986" y="396" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#647488">绑定调用、参数、资源和版本</text>
<text x="986" y="436" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#647488">排队后 / 派发前，重新检查</text>
<text x="986" y="588" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#26755B">OS 隔离沙箱</text>
<text x="986" y="634" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#647488">Seatbelt  /  bubblewrap</text>
<path d="M986 671H1368" fill="none" stroke="#D8E8DD"/>
<text x="986" y="691" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1F3042">限制目录读取与写入</text>
<text x="986" y="730" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1F3042">只允许授权网络域名</text>
<text x="986" y="769" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1F3042">凭证、数据、工具链受保护</text>
<text x="986" y="809" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">固定 PATH · 独立 HOME / TMP</text>
<rect x="986" y="860" width="382" height="32" rx="8" fill="#E3F0E7" stroke="#E3F0E7" stroke-width="1"/>
<text x="1070.5" y="865" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#26755B">隔离不可用 → 拒绝执行</text>
<text x="1037.5" y="975" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#26755B">受控执行 → 结果反馈给模型</text>
<text x="48" y="950" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1F3042">本机沙箱：本地文件、命令与 stdio MCP</text>
<text x="48" y="986" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">HTTP MCP 的远端内部执行，由远端负责隔离。</text>
<path d="M48 1040H1392" fill="none" stroke="#E7EDF2"/>
<text x="48" y="1062" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#647488">交互程序获准启动后，write_stdin 不再逐次审批；权限放行不扩大沙箱资源范围。</text>
</svg>