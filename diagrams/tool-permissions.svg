<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">MyAgent 工具执行的权限与隔离</title>
<desc id="desc">资源级权限与命令级权限分别检查，合并后允许、询问或拒绝；用户批准绑定本次操作，派发前复核，OS 沙箱限制真实执行。</desc>
<rect width="1440" height="1110" fill="#FFFFFF"/>
<text x="48" y="34" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#647488">MYAGENT  /  TOOL EXECUTION</text>
<text x="48" y="79" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="600" fill="#1F3042">工具执行的权限与隔离</text>
<text x="48" y="148" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#647488">命令获准启动，也必须留在已授权的资源范围内。</text>
