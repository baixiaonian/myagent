<text x="72" y="347" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" fill="#3566A8">资源级权限</text>
<text x="72" y="391" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#1F3042">能访问哪些资源？</text>
<text x="72" y="430" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#647488">目录读写 / 网络域名 / MCP</text>
<path d="M72 465H414" fill="none" stroke="#E7EDF2"/>
<text x="72" y="482" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1F3042">工作区内文件默认允许</text>
<text x="72" y="514" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">跨界查授权 · 显式拒绝优先</text>
<text x="72" y="601" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" fill="#3566A8">命令级权限</text>
