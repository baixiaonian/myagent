<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1150" viewBox="0 0 1480 1150" role="img" aria-labelledby="title desc">
<title id="title">MyAgent Hook：报告路径检查</title>
<desc id="desc">配置预览与授权后，在新 Run 冻结脚本版本。写文件前自动检查，拒绝反馈给模型，模型可调整路径，再通过 Hook 与原有权限后执行。</desc>
<rect width="1480" height="1150" fill="#FFFFFF"/>
<text x="52" y="30" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#647488">MYAGENT  /  HOOK V1</text>
<text x="52" y="72" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="600" fill="#1F3042">写文件之前，先过项目检查</text>
<text x="52" y="131" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#647488">例子：报告必须写入 reports/；检查自动触发，路径由模型调整。</text>
<rect x="48" y="192" width="1384" height="167" rx="18" fill="#F7F9FC" stroke="#E5EAF1" stroke-width="1"/>
<rect x="70" y="180" width="130" height="32" rx="8" fill="#EFF5FC" stroke="#EFF5FC" stroke-width="1"/>
<text x="87.5" y="185" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#3566A8">配置与生效</text>
<rect x="72" y="229" width="364" height="104" rx="12" fill="#FFFFFF" stroke="#DEE5ED" stroke-width="1"/>
<rect x="558" y="229" width="364" height="104" rx="12" fill="#FFFFFF" stroke="#DEE5ED" stroke-width="1"/>
<rect x="1044" y="229" width="364" height="104" rx="12" fill="#FFFFFF" stroke="#DEE5ED" stroke-width="1"/>
<text x="90" y="242" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#1F3042">① 准备配置和脚本</text>
<text x="90" y="281" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#647488">hooks.json  +  main.mjs</text>
<text x="576" y="242" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#1F3042">② 预览 → 确认授权</text>
<text x="576" y="281" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#647488">绑定配置、包版本和资源范围</text>
<text x="1062" y="242" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#1F3042">③ 下一 Run 生效</text>
<text x="1062" y="281" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#647488">冻结本轮配置与脚本快照</text>
<polygon points="558,281 547.0,276.0 547.0,286.0" fill="#3566A8"/>
<polyline points="436,281 558,281" fill="none" stroke="#3566A8" stroke-width="2"/>
<polygon points="1044,281 1033.0,276.0 1033.0,286.0" fill="#3566A8"/>
<polyline points="922,281 1044,281" fill="none" stroke="#3566A8" stroke-width="2"/>
<text x="72" y="398" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#1F3042">一次写报告任务</text>
<text x="929.75" y="402" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#6B57A6">匹配：PreToolUse · write_file</text>
<rect x="72" y="456" width="364" height="134" rx="16" fill="#EFF5FC" stroke="#C5D8ED" stroke-width="1"/>
<rect x="558" y="456" width="364" height="134" rx="16" fill="#F4F0FB" stroke="#D9CDEC" stroke-width="1"/>
<rect x="1044" y="456" width="364" height="134" rx="16" fill="#FCF1EF" stroke="#E7C9C3" stroke-width="1"/>
<rect x="72" y="731" width="364" height="134" rx="16" fill="#EFF5FC" stroke="#C5D8ED" stroke-width="1"/>
<rect x="558" y="731" width="364" height="134" rx="16" fill="#F4F0FB" stroke="#D9CDEC" stroke-width="1"/>
<rect x="1044" y="731" width="364" height="134" rx="16" fill="#EDF8F2" stroke="#BEDCCA" stroke-width="1"/>
<text x="94" y="472" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#3566A8">1  模型提出写文件</text>
<text x="94" y="515" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#1F3042">report.txt</text>
<text x="94" y="555" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">目标：项目根目录</text>
<text x="580" y="472" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#6B57A6">2  程序自动运行 Hook</text>
<text x="580" y="515" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1F3042">检查路径是否在 reports/</text>
<text x="580" y="555" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">此时还未派发写文件工具</text>
<text x="1066" y="472" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#AC4A49">3  deny · 拒绝本次写入</text>
<text x="1066" y="515" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#1F3042">请改用 reports/ 目录</text>
<text x="1066" y="555" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">原路径未写入文件</text>
<polygon points="558,523 547.0,518.0 547.0,528.0" fill="#3566A8"/>
<polyline points="436,523 558,523" fill="none" stroke="#3566A8" stroke-width="2"/>
<polygon points="1044,523 1033.0,518.0 1033.0,528.0" fill="#AC4A49"/>
<polyline points="922,523 1044,523" fill="none" stroke="#AC4A49" stroke-width="2"/>
<polygon points="254,731 259.0,720.0 249.0,720.0" fill="#AC4A49"/>
<polyline points="1226,590 1226,655 254,655 254,731" fill="none" stroke="#AC4A49" stroke-width="2"/>
<rect x="496" y="635" width="490" height="41" rx="1" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="588.0" y="643" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#AC4A49">拒绝原因 → 下一次模型请求</text>
<text x="94" y="747" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#3566A8">4  模型可调整路径</text>
<text x="94" y="790" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#1F3042">reports/report.txt</text>
<text x="94" y="830" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">重新提出一次工具调用</text>
<text x="580" y="747" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#6B57A6">5  再次检查 · continue</text>
<text x="580" y="790" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1F3042">路径符合本例的检查条件</text>
<text x="580" y="830" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">继续原有权限检查</text>
<text x="1066" y="747" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#26755B">6  沙箱内执行工具</text>
<text x="1066" y="790" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#1F3042">reports/report.txt</text>
<text x="1066" y="830" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">权限通过后，真实保存报告</text>
<polygon points="558,798 547.0,793.0 547.0,803.0" fill="#3566A8"/>
<polyline points="436,798 558,798" fill="none" stroke="#3566A8" stroke-width="2"/>
<polygon points="1044,798 1033.0,793.0 1033.0,803.0" fill="#26755B"/>
<polyline points="922,798 1044,798" fill="none" stroke="#26755B" stroke-width="2"/>
<text x="72" y="895" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#647488">Hook 不改写参数；示例展示模型收到拒绝后选择调整的分支。</text>
<rect x="48" y="961" width="1384" height="150" rx="16" fill="#F8FAFC" stroke="#E1E7ED" stroke-width="1"/>
<rect x="70" y="946" width="155" height="32" rx="8" fill="#F0F3F7" stroke="#F0F3F7" stroke-width="1"/>
<text x="90.5" y="951" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">脚本通信协议</text>
<rect x="72" y="989" width="364" height="86" rx="12" fill="#FFFFFF" stroke="#E0E7EF" stroke-width="1"/>
<rect x="558" y="989" width="364" height="86" rx="12" fill="#F4F0FB" stroke="#D9CDEC" stroke-width="1"/>
<rect x="1044" y="989" width="364" height="86" rx="12" fill="#FFFFFF" stroke="#E0E7EF" stroke-width="1"/>
<text x="92" y="1000" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#3566A8">stdin · JSON 事件</text>
<text x="92" y="1040" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">事件 / 工作区 / 工具参数</text>
<text x="578" y="1000" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#6B57A6">沙箱中的 main.mjs</text>
<text x="578" y="1040" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#647488">可信解释器 + 固定参数</text>
<text x="1064" y="1000" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#26755B">stdout · JSON 结果</text>
<text x="1064" y="1040" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#647488">continue / deny / 补充上下文</text>
<polygon points="558,1032 547.0,1027.0 547.0,1037.0" fill="#3566A8"/>
<polyline points="436,1032 558,1032" fill="none" stroke="#3566A8" stroke-width="2"/>
<polygon points="1044,1032 1033.0,1027.0 1033.0,1037.0" fill="#26755B"/>
<polyline points="922,1032 1044,1032" fill="none" stroke="#26755B" stroke-width="2"/>
<text x="72" y="1120" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#647488">stderr → 日志记录；日志不自动成为模型指令。</text>
</svg>