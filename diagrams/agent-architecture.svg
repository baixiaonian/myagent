<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1500" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">MyAgent 详细技术架构</title><desc id="arch-desc">产品入口和编排进入应用服务，由唯一运行内核组织上下文、模型、工具和权限；执行环境独立，状态和扩展通过接口接入。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4b7568"/></marker></defs><rect width="1540" height="1500" fill="#fffefb"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203c34"><text x="35" y="39" font-size="25" font-weight="700">MyAgent / 详细技术架构</text><text x="1205" y="38" font-size="14">实线：主调用　虚线：协作 / 返回</text><rect x="385" y="385" width="780" height="600" rx="16" fill="#f5f9f5" stroke="#b7cbbd" stroke-dasharray="7 5"/><text x="405" y="410" font-size="16" fill="#506d61">后端进程内 · 稳定内核与显式接口</text><rect x="385" y="1050" width="780" height="355" rx="16" fill="#fffaf3" stroke="#dcc39e"/><text x="405" y="1078" font-size="16" fill="#795c34">执行边界 · 通过 ExecutionPort 更换环境</text><polyline points="770,180 770,235" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="770,180 770,235" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="213" font-size="14" fill="#537263">命令 ↓ / SSE 事件 ↑</text><polyline points="1205,290 1100,290" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="1205,290 1100,290" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><polyline points="770,345 770,430" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="770,345 770,430" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="391" font-size="14" fill="#537263">启动 / 恢复 Run</text><polyline points="585,545 585,605" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="585,545 585,605" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="580" font-size="14" fill="#537263">准备资料</text><polyline points="750,665 800,665" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="750,665 800,665" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1130,665 1150,665 1150,487 1130,487" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="1130,665 1150,665 1150,487 1130,487" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="765,545 765,775 585,775 585,810" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="765,545 765,775 585,775 585,810" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="777" y="759" font-size="14" fill="#537263">工具请求</text><polyline points="750,877 800,877" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="750,877 800,877" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><polyline points="965,945 965,1030 965,1100" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="965,945 965,1030 965,1100" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="1020" font-size="14" fill="#537263">携带执行授权</text><polyline points="585,1190 585,1260" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="585,1190 585,1260" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1230" font-size="14" fill="#537263">受限执行</text><polyline points="965,1190 965,1260" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="965,1190 965,1260" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="1230" font-size="14" fill="#537263">协议调用</text><polyline points="420,1145 395,1145 395,907 420,907" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="420,1145 395,1145 395,907 420,907" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="420,845 405,845 405,507 420,507" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="420,845 405,845 405,507 420,507" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="420,470 335,470" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="420,470 335,470" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="344" y="456" font-size="14" fill="#537263">提交</text><polyline points="420,650 375,650 375,650 335,650" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="420,650 375,650 375,650 335,650" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="420,700 360,700 360,830 335,830" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="420,700 360,700 360,830 335,830" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="80,550 20,550 20,1120 35,1120" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="80,550 20,550 20,1120 35,1120" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="80,710 10,710 10,1170 35,1170" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="80,710 10,710 10,1170 35,1170" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="185,915 185,1070" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="185,915 185,1070" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="196" y="999" font-size="14" fill="#537263">版本内容 / 索引</text><polyline points="1205,495 1180,495 1180,450 1130,450" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="1205,495 1180,495 1180,450 1130,450" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1355,575 1355,635" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="1355,575 1355,635" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1370" y="610" font-size="14" fill="#537263">提供目录与扩展点</text><polyline points="1355,945 1355,1020 1100,1020 1100,1100" fill="none" stroke="#fffefb" stroke-width="7"/><polyline points="1355,945 1355,1020 1100,1020 1100,1100" fill="none" stroke="#4b7568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1210" y="1005" font-size="14" fill="#537263">凭证引用</text><g><rect x="440" y="80" width="660" height="100" rx="10" fill="#e9f4ed" stroke="#568b75"/><text x="456" y="110" font-size="19" font-weight="650">01  产品入口 · Web / CLI / SDK</text><text x="456" y="137" font-size="15" fill="#50685e">对话与任务列表 · 运行进度 · 人工交互 · 产物预览与下载</text></g><g><rect x="440" y="235" width="660" height="110" rx="10" fill="#e9f4ed" stroke="#568b75"/><text x="456" y="265" font-size="19" font-weight="650">02  Application · 应用服务</text><text x="456" y="292" font-size="15" fill="#50685e">身份与工作区 / 命令幂等 / 会话写入队列</text><text x="456" y="315" font-size="15" fill="#50685e">start · steer · followUp · cancel · resume · 事件订阅</text></g><g><rect x="420" y="430" width="710" height="115" rx="10" fill="#e9f4ed" stroke="#568b75"/><text x="436" y="460" font-size="19" font-weight="650">03  Agent Runtime · 唯一运行循环</text><text x="436" y="487" font-size="15" fill="#50685e">Run / Step 状态机 · Inbox · 预算与停止条件 · 取消树</text><text x="436" y="510" font-size="15" fill="#50685e">每步冻结配置、工具目录与上下文版本；完成后检查验收</text></g><g><rect x="420" y="605" width="330" height="125" rx="10" fill="#e9f4ed" stroke="#568b75"/><text x="436" y="635" font-size="19" font-weight="650">04  Context Builder</text><text x="436" y="662" font-size="15" fill="#50685e">指令层级 / 历史分支 / Skill</text><text x="436" y="685" font-size="15" fill="#50685e">检索与记忆 / token 预算</text><text x="436" y="708" font-size="15" fill="#50685e">压缩摘要 + 来源引用 + 快照</text></g><g><rect x="800" y="605" width="330" height="125" rx="10" fill="#e9f4ed" stroke="#568b75"/><text x="816" y="635" font-size="19" font-weight="650">05  Model Gateway</text><text x="816" y="662" font-size="15" fill="#50685e">能力表 / 模型路由 / 厂商适配</text><text x="816" y="685" font-size="15" fill="#50685e">统一消息、工具调用与流事件</text><text x="816" y="708" font-size="15" fill="#50685e">超时 / 重试 / 用量与成本</text></g><g><rect x="420" y="810" width="330" height="135" rx="10" fill="#fff2e4" stroke="#ba864b"/><text x="436" y="840" font-size="19" font-weight="650">06  Tool System</text><text x="436" y="867" font-size="15" fill="#50685e">Registry / Schema / Hook 管线</text><text x="436" y="890" font-size="15" fill="#50685e">最终参数冻结 / 资源锁</text><text x="436" y="913" font-size="15" fill="#50685e">有界并发 / 结果归并与截断</text></g><g><rect x="800" y="810" width="330" height="135" rx="10" fill="#fff2e4" stroke="#ba864b"/><text x="816" y="840" font-size="19" font-weight="650">07  Policy + Interaction</text><text x="816" y="867" font-size="15" fill="#50685e">主体、资源、效果与授权范围</text><text x="816" y="890" font-size="15" fill="#50685e">allow / deny / ask；等待落库</text><text x="816" y="913" font-size="15" fill="#50685e">审批绑定参数摘要；恢复再校验</text></g><g><rect x="420" y="1100" width="710" height="90" rx="10" fill="#fff2e4" stroke="#ba864b"/><text x="436" y="1130" font-size="19" font-weight="650">08  Execution Gateway · 执行网关</text><text x="436" y="1157" font-size="15" fill="#50685e">能力授权 / workspaceRef / deadline / 凭证引用 / dispatch · cancel · receipt</text></g><g><rect x="420" y="1260" width="330" height="115" rx="10" fill="#fff2e4" stroke="#ba864b"/><text x="436" y="1290" font-size="19" font-weight="650">执行 Worker / 容器</text><text x="436" y="1317" font-size="15" fill="#50685e">文件读写 · Shell · Playwright</text><text x="436" y="1340" font-size="15" fill="#50685e">进程回收 / 文件与网络隔离</text><text x="436" y="1363" font-size="15" fill="#50685e">主进程与执行环境分离</text></g><g><rect x="800" y="1260" width="330" height="115" rx="10" fill="#fff2e4" stroke="#ba864b"/><text x="816" y="1290" font-size="19" font-weight="650">外部连接器 / MCP</text><text x="816" y="1317" font-size="15" fill="#50685e">MCP stdio 或 Streamable HTTP</text><text x="816" y="1340" font-size="15" fill="#50685e">HTTP API · 云端工具</text><text x="816" y="1363" font-size="15" fill="#50685e">返回结构化结果与外部回执</text></g><g><rect x="35" y="430" width="300" height="120" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="51" y="460" font-size="19" font-weight="650">Session / Run / Invocation</text><text x="51" y="487" font-size="15" fill="#50685e">历史分支 / 运行检查点</text><text x="51" y="510" font-size="15" fill="#50685e">调用意图 / 参数摘要 / 回执</text><text x="51" y="533" font-size="15" fill="#50685e">每个 Session 单写者</text></g><g><rect x="35" y="595" width="300" height="115" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="51" y="625" font-size="19" font-weight="650">Task / Plan</text><text x="51" y="652" font-size="15" fill="#50685e">目标 / 约束 / 验收标准</text><text x="51" y="675" font-size="15" fill="#50685e">计划版本 / 子任务关联</text><text x="51" y="698" font-size="15" fill="#50685e">一项 Task 可以跨多次 Run</text></g><g><rect x="35" y="770" width="300" height="145" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="51" y="800" font-size="19" font-weight="650">Content Services</text><text x="51" y="827" font-size="15" fill="#50685e">Memory：长期事实与偏好</text><text x="51" y="850" font-size="15" fill="#50685e">Retrieval：导入、切块、来源</text><text x="51" y="873" font-size="15" fill="#50685e">Artifact：文件、版本与验证</text><text x="51" y="896" font-size="15" fill="#50685e">资料包通过 ContentPort 读取</text></g><g><rect x="35" y="1070" width="300" height="145" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="51" y="1100" font-size="19" font-weight="650">Storage Adapters</text><text x="51" y="1127" font-size="15" fill="#50685e">SQLite：状态 + 持久事件事务</text><text x="51" y="1150" font-size="15" fill="#50685e">文件：原始材料 / 产物 / 大输出</text><text x="51" y="1173" font-size="15" fill="#50685e">FTS5：可重建全文索引</text><text x="51" y="1196" font-size="15" fill="#50685e">JSONL：导出与诊断</text></g><g><rect x="1205" y="235" width="300" height="140" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="1221" y="265" font-size="19" font-weight="650">Orchestration</text><text x="1221" y="292" font-size="15" fill="#50685e">Workflow / Scheduler / Jobs</text><text x="1221" y="315" font-size="15" fill="#50685e">Subagents / Mailbox</text><text x="1221" y="338" font-size="15" fill="#50685e">统一调用 RunCommandPort</text><text x="1221" y="361" font-size="15" fill="#50685e">子任务独立 Session 与预算</text></g><g><rect x="1205" y="430" width="300" height="145" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="1221" y="460" font-size="19" font-weight="650">Extension Host</text><text x="1221" y="487" font-size="15" fill="#50685e">manifest / API 版本 / 依赖排序</text><text x="1221" y="510" font-size="15" fill="#50685e">activate / dispose / 注册作用域</text><text x="1221" y="533" font-size="15" fill="#50685e">注册模型、工具、Skill 与 Hook</text><text x="1221" y="556" font-size="15" fill="#50685e">活动 Run 固定能力版本</text></g><g><rect x="1205" y="635" width="300" height="110" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="1221" y="665" font-size="19" font-weight="650">Skill Catalog + Hooks</text><text x="1221" y="692" font-size="15" fill="#50685e">Skill：摘要发现、按需读正文</text><text x="1221" y="715" font-size="15" fill="#50685e">Hook：固定时点、固定返回值</text><text x="1221" y="738" font-size="15" fill="#50685e">脚本动作进入执行治理</text></g><g><rect x="1205" y="810" width="300" height="135" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="1221" y="840" font-size="19" font-weight="650">Credentials + Identity</text><text x="1221" y="867" font-size="15" fill="#50685e">本地身份 / 远端 OIDC</text><text x="1221" y="890" font-size="15" fill="#50685e">操作系统凭证库 / Secret</text><text x="1221" y="913" font-size="15" fill="#50685e">按调用范围注入凭证</text><text x="1221" y="936" font-size="15" fill="#50685e">原始密钥不进入上下文</text></g><g><rect x="1205" y="1100" width="300" height="165" rx="10" fill="#f2eff8" stroke="#8d80a7"/><text x="1221" y="1130" font-size="19" font-weight="650">Observability + Evals</text><text x="1221" y="1157" font-size="15" fill="#50685e">runId → stepId → toolCallId</text><text x="1221" y="1180" font-size="15" fill="#50685e">结构化日志 / Trace / 指标</text><text x="1221" y="1203" font-size="15" fill="#50685e">授权与执行审计独立持久化</text><text x="1221" y="1226" font-size="15" fill="#50685e">任务质量 / 成本 / 时间基线</text><text x="1221" y="1249" font-size="15" fill="#50685e">订阅脱敏事件，覆盖全部模块</text></g><text x="35" y="1440" font-size="16" font-weight="650">设计约束</text><text x="35" y="1470" font-size="15">状态单一归属 · Hook 后重新校验 · 外部动作结果未知先对账 · 取消停止派发并收拢执行 · 模型结束后仍需产物验收</text></g></svg>