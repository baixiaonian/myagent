<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1550" viewBox="0 0 1800 1550" role="img" aria-labelledby="title desc"><title id="title">MyAgent 当前聊天链路与原设计、代码提交的对应关系</title><desc id="desc">从 Web 和 SDK 发送问题，经本地 Server、Application、Kernel、模型适配器调用用户模型；回答回到应用层，持久化至 SQLite 后经 SSE 和 SDK 展示。配置与凭证独立保存，完整 Agent 扩展仍为骨架。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3570BC"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#238568"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7852A5"/></marker></defs><rect width="1800" height="1550" fill="#FCFDFE"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="53" font-size="32" font-weight="700" fill="#172D3B">MyAgent · 当前聊天机器人，一张图读懂设计如何落地</text><text x="40" y="87" font-size="18" font-weight="400" fill="#526779">实现快照：df8169e  /  本地单用户 Web Chat v1  /  8 个聊天模块已实现，7 个 workspace 仍为骨架</text><rect x="40" y="112" width="840" height="94" rx="14" fill="#F3F5F7" stroke="#CDD4DC" stroke-width="1.5"/><rect x="40" y="128" width="4" height="25" rx="2" fill="#7B8793"/><text x="59" y="148" font-size="22" font-weight="700" fill="#172D3B">30b326b · 初始化工程骨架</text><text x="59" y="176" font-size="15" font-weight="400" fill="#7B8793">15 个 workspace + 原始架构报告 + AGENTS / docs + 8 项工程测试</text><rect x="920" y="112" width="840" height="94" rx="14" fill="#EFF9F5" stroke="#93C7B5" stroke-width="1.5"/><rect x="920" y="128" width="4" height="25" rx="2" fill="#238568"/><text x="939" y="148" font-size="22" font-weight="700" fill="#172D3B">df8169e · 实现聊天产品</text><text x="939" y="176" font-size="15" font-weight="400" fill="#238568">补齐下方彩色链路、持久化与交互 + 32 项工程测试 + Web / Docker 验收</text><rect x="40" y="226" width="1720" height="68" rx="14" fill="#F6F1FC" stroke="#C4AEDF" stroke-width="1.5"/><rect x="40" y="242" width="4" height="25" rx="2" fill="#7852A5"/><text x="59" y="262" font-size="22" font-weight="700" fill="#172D3B">Contracts · 全链路共享协议</text><text x="59" y="290" font-size="15" font-weight="400" fill="#7852A5">Session / Message / Run / Settings / ChatEvent / AppError   ·   packages/contracts/src/index.ts   ·   这是数据约定，不是运行步骤</text><text x="40" y="330" font-size="19" font-weight="700" fill="#3570BC">发送问题 →</text><text x="1190" y="330" font-size="16" font-weight="400" fill="#526779">蓝：请求调用     绿：回答回传     紫：本地状态</text><rect x="40" y="350" width="320" height="260" rx="14" fill="#F0F6FF" stroke="#9EBBE0" stroke-width="1.5"/><rect x="40" y="366" width="4" height="25" rx="2" fill="#3570BC"/><text x="59" y="386" font-size="22" font-weight="700" fill="#172D3B">① 输入问题 · Web / SDK</text><text x="59" y="414" font-size="15" font-weight="400" fill="#3570BC">对应原设计 01：产品入口</text><text x="59" y="451" font-size="17" font-weight="400" fill="#526779">App 收集问题与当前会话版本</text><text x="59" y="478" font-size="17" font-weight="400" fill="#526779">ChatClient.send / regenerate</text><text x="59" y="505" font-size="17" font-weight="400" fill="#526779">requestId 防止重复提交</text><text x="59" y="532" font-size="17" font-weight="400" fill="#526779">HTTP 命令返回 Run + 快照</text><text x="59" y="571" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">apps/web/src/App.tsx</text><text x="59" y="591" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">packages/sdk/src/index.ts</text><rect x="390" y="350" width="320" height="260" rx="14" fill="#F0F6FF" stroke="#9EBBE0" stroke-width="1.5"/><rect x="390" y="366" width="4" height="25" rx="2" fill="#3570BC"/><text x="409" y="386" font-size="22" font-weight="700" fill="#172D3B">② 接入与装配 · Server</text><text x="409" y="414" font-size="15" font-weight="400" fill="#3570BC">原设计：本地后端组合根</text><text x="409" y="451" font-size="17" font-weight="400" fill="#526779">Fastify：JSON / Host / Origin</text><text x="409" y="478" font-size="17" font-weight="400" fill="#526779">POST /sessions/:id/runs</text><text x="409" y="505" font-size="17" font-weight="400" fill="#526779">构造并注入仓储、凭证、模型</text><text x="409" y="532" font-size="17" font-weight="400" fill="#526779">生产模式同时托管 Web</text><text x="409" y="571" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">apps/server/src/</text><text x="409" y="591" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">bootstrap/index.ts</text><rect x="740" y="350" width="320" height="260" rx="14" fill="#F0F6FF" stroke="#9EBBE0" stroke-width="1.5"/><rect x="740" y="366" width="4" height="25" rx="2" fill="#3570BC"/><text x="759" y="386" font-size="22" font-weight="700" fill="#172D3B">③ 开始运行 · Application</text><text x="759" y="414" font-size="15" font-weight="400" fill="#3570BC">对应原设计 02：应用服务</text><text x="759" y="451" font-size="17" font-weight="400" fill="#526779">ChatService.start：检查幂等</text><text x="759" y="478" font-size="17" font-weight="400" fill="#526779">读取历史与启动时配置快照</text><text x="759" y="505" font-size="17" font-weight="400" fill="#526779">先 buildContext，再 beginRun</text><text x="759" y="532" font-size="17" font-weight="400" fill="#526779">原子保存问题 / 候选 / Run</text><text x="759" y="591" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">packages/application/src/chat.ts</text><rect x="1090" y="350" width="320" height="260" rx="14" fill="#F0F6FF" stroke="#9EBBE0" stroke-width="1.5"/><rect x="1090" y="366" width="4" height="25" rx="2" fill="#3570BC"/><text x="1109" y="386" font-size="22" font-weight="700" fill="#172D3B">④ 组装与执行 · Kernel</text><text x="1109" y="414" font-size="15" font-weight="400" fill="#3570BC">对应原设计 04 上下文 + 03 内核</text><text x="1109" y="451" font-size="17" font-weight="400" fill="#526779">buildContext → runChat</text><text x="1109" y="478" font-size="17" font-weight="400" fill="#526779">系统词 + 当前问 + 最近完整轮</text><text x="1109" y="505" font-size="17" font-weight="400" fill="#526779">最多 20 轮 / 32,000 字符</text><text x="1109" y="532" font-size="17" font-weight="400" fill="#526779">每 Run 调模型一次；取消 / 超时</text><text x="1109" y="571" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">packages/kernel/src/</text><text x="1109" y="591" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">context/index.ts · runtime/index.ts</text><rect x="1440" y="350" width="320" height="260" rx="14" fill="#F0F6FF" stroke="#9EBBE0" stroke-width="1.5"/><rect x="1440" y="366" width="4" height="25" rx="2" fill="#3570BC"/><text x="1459" y="386" font-size="22" font-weight="700" fill="#172D3B">⑤ 模型通信 · Adapters</text><text x="1459" y="414" font-size="15" font-weight="400" fill="#3570BC">对应原设计 05：Model Gateway</text><text x="1459" y="451" font-size="17" font-weight="400" fill="#526779">实现 Kernel 定义的 ModelPort</text><text x="1459" y="478" font-size="17" font-weight="400" fill="#526779">OpenAI SDK Chat Completions</text><text x="1459" y="505" font-size="17" font-weight="400" fill="#526779">自定义 baseURL / model</text><text x="1459" y="532" font-size="17" font-weight="400" fill="#526779">流式文字；关闭自动重试</text><text x="1459" y="571" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">packages/adapters/src/</text><text x="1459" y="591" font-family="Menlo,monospace" font-size="12.5" fill="#3570BC">models/openai/index.ts</text><rect x="1440" y="672" width="320" height="74" rx="14" fill="#F3F5F7" stroke="#CDD4DC" stroke-width="1.5"/><rect x="1440" y="688" width="4" height="25" rx="2" fill="#7B8793"/><text x="1459" y="708" font-size="22" font-weight="700" fill="#172D3B">外部：用户配置的模型服务</text><text x="1459" y="736" font-size="15" font-weight="400" fill="#7B8793">目前已验收 DeepSeek；经网络请求</text><rect x="40" y="785" width="320" height="240" rx="14" fill="#EFF9F5" stroke="#93C7B5" stroke-width="1.5"/><rect x="40" y="801" width="4" height="25" rx="2" fill="#238568"/><text x="59" y="821" font-size="22" font-weight="700" fill="#172D3B">⑨ 显示答案 · SDK / Web</text><text x="59" y="849" font-size="15" font-weight="400" fill="#238568">同一浏览器中的事件投影与渲染</text><text x="59" y="886" font-size="17" font-weight="400" fill="#526779">subscribe 检查事件序号、去重</text><text x="59" y="913" font-size="17" font-weight="400" fill="#526779">applyEvent 更新会话快照</text><text x="59" y="940" font-size="17" font-weight="400" fill="#526779">React → Markdown / 代码复制</text><text x="59" y="967" font-size="17" font-weight="400" fill="#526779">重新打开：先快照，再补读事件</text><text x="59" y="986" font-family="Menlo,monospace" font-size="12.5" fill="#238568">packages/sdk/src/index.ts</text><text x="59" y="1006" font-family="Menlo,monospace" font-size="12.5" fill="#238568">apps/web/src/App.tsx</text><rect x="390" y="785" width="320" height="240" rx="14" fill="#EFF9F5" stroke="#93C7B5" stroke-width="1.5"/><rect x="390" y="801" width="4" height="25" rx="2" fill="#238568"/><text x="409" y="821" font-size="22" font-weight="700" fill="#172D3B">⑧ 传回事件 · Server</text><text x="409" y="849" font-size="15" font-weight="400" fill="#238568">持久事件 → SSE → 浏览器</text><text x="409" y="886" font-size="17" font-weight="400" fill="#526779">GET /sessions/:id/events</text><text x="409" y="913" font-size="17" font-weight="400" fill="#526779">每 250ms 读取已落库事件</text><text x="409" y="940" font-size="17" font-weight="400" fill="#526779">按 seq / after 游标补读</text><text x="409" y="967" font-size="17" font-weight="400" fill="#526779">断开订阅不会取消后台生成</text><text x="409" y="986" font-family="Menlo,monospace" font-size="12.5" fill="#238568">apps/server/src/</text><text x="409" y="1006" font-family="Menlo,monospace" font-size="12.5" fill="#238568">bootstrap/index.ts</text><rect x="740" y="785" width="320" height="240" rx="14" fill="#EFF9F5" stroke="#93C7B5" stroke-width="1.5"/><rect x="740" y="801" width="4" height="25" rx="2" fill="#238568"/><text x="759" y="821" font-size="22" font-weight="700" fill="#172D3B">⑥ 收集答案 · Application</text><text x="759" y="849" font-size="15" font-weight="400" fill="#238568">runChat 的 onText 回调</text><text x="759" y="886" font-size="17" font-weight="400" fill="#526779">流式文本先汇入 buffer</text><text x="759" y="913" font-size="17" font-weight="400" fill="#526779">约 250ms 调用 appendDelta</text><text x="759" y="940" font-size="17" font-weight="400" fill="#526779">结束立即 flush + finishRun</text><text x="759" y="967" font-size="17" font-weight="400" fill="#526779">成功 / 停止 / 失败明确终结</text><text x="759" y="1006" font-family="Menlo,monospace" font-size="12.5" fill="#238568">packages/application/src/chat.ts</text><rect x="1090" y="785" width="670" height="240" rx="14" fill="#FFF8EC" stroke="#DEBE8B" stroke-width="1.5"/><rect x="1090" y="801" width="4" height="25" rx="2" fill="#AA7228"/><text x="1109" y="821" font-size="22" font-weight="700" fill="#172D3B">连接与凭证 · SettingsService</text><text x="1109" y="849" font-size="15" font-weight="400" fill="#AA7228">原设计 Credentials：本版采用独立本地文件；应用层在运行开始前读取</text><text x="1109" y="886" font-size="17" font-weight="400" fill="#526779">设置页 → SDK → Server → SettingsService.save / test</text><text x="1109" y="913" font-size="17" font-weight="400" fill="#526779">baseURL、model、systemPrompt 存 SQLite；每次运行冻结连接配置</text><text x="1109" y="940" font-size="17" font-weight="400" fill="#526779">密钥保存为 credentials.json（0600）；读取设置只返回掩码</text><text x="1109" y="967" font-size="17" font-weight="400" fill="#526779">连接测试执行独立短请求，不写聊天历史</text><text x="1109" y="986" font-family="Menlo,monospace" font-size="12.5" fill="#AA7228">packages/application/src/settings.ts</text><text x="1109" y="1006" font-family="Menlo,monospace" font-size="12.5" fill="#AA7228">packages/adapters/src/credentials/index.ts</text><rect x="740" y="1085" width="1020" height="195" rx="14" fill="#F6F1FC" stroke="#C4AEDF" stroke-width="1.5"/><rect x="740" y="1101" width="4" height="25" rx="2" fill="#7852A5"/><text x="759" y="1121" font-size="22" font-weight="700" fill="#172D3B">⑦ 本地状态 · State → SQLite Adapter</text><text x="759" y="1149" font-size="15" font-weight="400" fill="#7852A5">对应原设计 Session / Run + Storage：ChatStore 契约由 SqliteChatStore 实现</text><text x="759" y="1186" font-size="17" font-weight="400" fill="#526779">Drizzle + better-sqlite3 + WAL；增量内容与事件同事务落库，SSE 才能读取</text><text x="759" y="1213" font-size="17" font-weight="400" fill="#526779">~/.myagent/state.db 保存会话、消息、Run、事件和脱敏配置；唯一索引保护同会话单运行</text><text x="759" y="1241" font-family="Menlo,monospace" font-size="12.5" fill="#7852A5">packages/state/src/index.ts  →  packages/adapters/src/storage/sqlite/store.ts</text><text x="759" y="1261" font-family="Menlo,monospace" font-size="12.5" fill="#7852A5">migrations/0001_chat.sql</text><rect x="40" y="1085" width="670" height="168" rx="14" fill="#F0F6FF" stroke="#9EBBE0" stroke-width="1.5"/><rect x="40" y="1101" width="4" height="25" rx="2" fill="#3570BC"/><text x="59" y="1121" font-size="22" font-weight="700" fill="#172D3B">当前代码中的控制与恢复</text><text x="59" y="1149" font-size="15" font-weight="400" fill="#3570BC">与上述主链路复用同一套 Run / 仓储</text><text x="59" y="1186" font-size="17" font-weight="400" fill="#526779">停止：cancel → AbortSignal → 模型；保留已生成文字</text><text x="59" y="1213" font-size="17" font-weight="400" fill="#526779">重新生成：候选成功才替换原答案；重启：running → interrupted</text><text x="59" y="1240" font-size="17" font-weight="400" fill="#526779">会话列表 / 读取 / 新建 / 重命名由 Server 直接访问 store</text><rect x="40" y="1320" width="1720" height="145" rx="14" fill="#F3F5F7" stroke="#CDD4DC" stroke-width="1.5"/><rect x="40" y="1336" width="4" height="25" rx="2" fill="#7B8793"/><text x="59" y="1356" font-size="22" font-weight="700" fill="#172D3B">灰色范围仍未实现 · 原架构是完整 Agent 目标，当前只打通文字聊天</text><text x="59" y="1384" font-size="15" font-weight="400" fill="#7B8793">原设计 06 Tool System / 07 Policy + Interaction / 08 Execution Gateway / Worker / MCP 均未接入聊天链路</text><text x="59" y="1421" font-size="17" font-weight="400" fill="#526779">Content：记忆 / 检索 / 产物　·　Extensions：Skill / Hook / Plugin　·　Orchestration：Workflow / 多 Agent</text><text x="59" y="1448" font-size="17" font-weight="400" fill="#526779">Task / Invocation、CLI、Observability、testing 包仍是骨架；测试用假模型不代表这些产品模块已完成</text><polyline points="360,480 390,480" fill="none" stroke="#3570BC" stroke-width="2.5"/><polygon points="390,480 379.0,485.0 379.0,475.0" fill="#3570BC"/><polyline points="710,480 740,480" fill="none" stroke="#3570BC" stroke-width="2.5"/><polygon points="740,480 729.0,485.0 729.0,475.0" fill="#3570BC"/><polyline points="1060,480 1090,480" fill="none" stroke="#3570BC" stroke-width="2.5"/><polygon points="1090,480 1079.0,485.0 1079.0,475.0" fill="#3570BC"/><polyline points="1410,480 1440,480" fill="none" stroke="#3570BC" stroke-width="2.5"/><polygon points="1440,480 1429.0,485.0 1429.0,475.0" fill="#3570BC"/><polyline points="1630,610 1630,672" fill="none" stroke="#3570BC" stroke-width="2.5"/><polygon points="1630,672 1625.0,661.0 1635.0,661.0" fill="#3570BC"/><text x="1644" y="646" font-size="16" fill="#3570BC">HTTP 请求</text><polyline points="1510,672 1510,610" fill="none" stroke="#238568" stroke-width="2.5"/><polygon points="1510,610 1515.0,621.0 1505.0,621.0" fill="#238568"/><polyline points="1440,572 1410,572" fill="none" stroke="#238568" stroke-width="2.5"/><polygon points="1410,572 1421.0,567.0 1421.0,577.0" fill="#238568"/><polyline points="1190,610 1190,714 900,714 900,785" fill="none" stroke="#238568" stroke-width="2.5"/><polygon points="900,785 895.0,774.0 905.0,774.0" fill="#238568"/><text x="915" y="700" font-size="16" fill="#238568">文字增量经 runChat 返回 onText</text><polyline points="900,1025 900,1085" fill="none" stroke="#7852A5" stroke-width="2.5"/><polygon points="900,1085 895.0,1074.0 905.0,1074.0" fill="#7852A5"/><text x="916" y="1060" font-size="16" fill="#7852A5">先落库</text><polyline points="740,1163 725,1163 725,1056 550,1056 550,1025" fill="none" stroke="#238568" stroke-width="2.5"/><polygon points="550,1025 555.0,1036.0 545.0,1036.0" fill="#238568"/><polyline points="390,905 360,905" fill="none" stroke="#238568" stroke-width="2.5"/><polygon points="360,905 371.0,900.0 371.0,910.0" fill="#238568"/><text x="40" y="758" font-size="19" font-weight="700" fill="#238568">← 回答返回：先保存，再展示</text><text x="40" y="1501" font-size="18" font-weight="400" fill="#172D3B">读图方法：①→⑤ 发起一次模型调用；⑥→⑨ 把回答可靠地送回页面。上下文由应用层先组装，模型不会直接向浏览器推送。</text><text x="40" y="1530" font-size="15" font-weight="400" fill="#526779">设计编号沿用 agent-architecture.html / diagrams/agent-architecture.svg。完整源码定位与阶段差异见 docs/architecture/chat-flow.md。</text></g></svg>