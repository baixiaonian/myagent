<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1360" viewBox="0 0 1500 1360" role="img" aria-labelledby="title desc">
<title id="title">MyAgent 插件：安装、接入与版本生命周期</title>
<desc id="desc">本地与 Git 插件经校验和用户确认后发布不可变包。新 Run 冻结三类组件，Skill 提供上下文，MCP 提供工具，Hook 在生命周期触发，执行复用原有权限与隔离。旧引用释放后清理。</desc>
<rect width="1500" height="1360" fill="#FFFFFF"/>
<text x="48" y="30" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#647488">MYAGENT / PLUGINS</text>
<text x="48" y="66" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="600" fill="#1F3042">一个插件包，接入三类能力</text>
<text x="49" y="122" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#647488">安装与版本由插件层管理，任务仍由原有 Agent Loop 自主执行。</text>
