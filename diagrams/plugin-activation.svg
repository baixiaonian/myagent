<title id="title">MyAgent 插件：从配置到本轮生效</title>
<desc id="desc">插件包声明和管理设置经校验与确认发布。任务开始冻结同一份版本，三类提供者分别进入上下文、工具定义与生命周期。外部 Hook 兼容层尚未实现。</desc>
